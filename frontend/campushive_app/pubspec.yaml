name: campushive_app
description: "Campus Hive - A campus management and community platform."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.1

dependencies:
  file_picker: ^13.1.0
  firebase_auth: ^6.7.0
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  go_router: ^17.5.0
  http: ^1.6.0
  image_picker: ^1.2.3
  provider: ^6.1.5+1
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/logos/campus_hive_logo.png
    - assets/logos/campus_hive_header_logo.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/logos/campus_hive_app_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/logos/campus_hive_app_icon.png"